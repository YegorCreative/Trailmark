<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Parks &mdash; TrailMark</title>
    <meta name="description" content="All 63 U.S. national parks in the TrailMark illustrated archive. Filter by region, state, landscape, and which pages are open." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/styles-responsive.css" />
    <link rel="stylesheet" href="css/atlas.css" />
  </head>
  <body>
    <a class="skip-link" href="#park-index">Skip to the park index</a>
    <header id="site-header">
      <div class="header-inner">
        <div class="logo">
          <a href="index.html" class="logo-link">
            <img class="logo-mark" src="assets/img/logo-mark.webp" alt="" aria-hidden="true"  width="242" height="128" />
            <span class="logo-text">TrailMark</span>
          </a>
        </div>
        <nav id="site-nav" aria-label="Site navigation">
          <ul class="nav-list">
            <li class="nav-item--parks"><a href="parks.html" class="nav-link" data-nav="parks">Parks</a></li>
            <li><a href="about.html" class="nav-link" data-nav="about">About</a></li>
            <li><a href="faq.html" class="nav-link" data-nav="faq">FAQ</a></li>
            <li><a href="contact.html" class="nav-link" data-nav="contact">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main-content">
      <section class="atlas-page" id="park-index">
        <div class="atlas-page-inner">
          <p class="atlas-kicker">The collection</p>
          <h1 class="atlas-title">All 63 parks.</h1>
          <p class="atlas-count"><span data-index-count>0 of 63 open</span> <span data-index-shown></span></p>
          <div class="index-toolbar">
            <button type="button" class="filter-launch" aria-expanded="false" aria-controls="filter-sheet"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.6 5.3V13l-2.8 1.1V8.3L2 3z" fill="currentColor"/></svg> Filter &amp; sort</button>
            <div class="filter-chips" data-filter-chips></div>
          </div>
          <div id="filter-sheet" class="filter-sheet">
          <form class="atlas-filters" action="parks.html" role="search">
            <div class="pill-row" data-pills="region" aria-label="Region"></div>
            <div class="pill-row" data-pills="landscape" aria-label="Landscape"></div>
            <div class="filter-compact">
              <label class="filter-field">State
                <select id="filter-state" name="state"></select>
              </label>
              <label class="filter-field">Status
                <select id="filter-status" name="status">
                  <option value="">Open and coming soon</option>
                  <option value="open">Open</option>
                  <option value="soon">Coming soon</option>
                </select>
              </label>
              <label class="filter-field">Sort
                <select id="filter-sort" name="sort">
                  <option value="az">A–Z</option>
                  <option value="region">By region</option>
                  <option value="newest">Newest in archive</option>
                </select>
              </label>
              <label class="filter-field filter-field--search">Search
                <input id="park-search" name="q" type="search" placeholder="Name, state, region" autocomplete="off" />
              </label>
            </div>
            <select id="filter-region" class="filter-native" aria-label="Region"></select>
            <select id="filter-landscape" class="filter-native" aria-label="Landscape"></select>
            <button type="button" class="filter-done">Show parks</button>
          </form>
          </div>
          <div class="atlas-index" data-park-index></div>
        </div>
      </section>
    </main>
    <footer id="site-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="footer-logo-text">TrailMark</span>
        </div>
        <nav class="footer-nav" aria-label="Footer navigation">
          <a href="parks.html" class="footer-nav-link">Parks</a>
          <a href="about.html" class="footer-nav-link">About</a>
          <a href="faq.html" class="footer-nav-link">FAQ</a>
          <a href="contact.html" class="footer-nav-link">Contact</a>
        </nav>
        <p class="footer-copy">&copy; 2026 &mdash; Celebrating America&rsquo;s National Parks</p>
      </div>
    </footer>
    <script src="js/parks-data.js"></script>
    <script src="js/atlas.js"></script>
  </body>
</html>

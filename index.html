<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailmark &mdash; Explore America's National Parks</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Main styles -->
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Responsive overrides -->
    <link rel="stylesheet" href="css/styles-responsive.css" />
  </head>
  <body>

    <!-- =====================
         HEADER
    ===================== -->
    <header id="site-header">
      <div class="header-inner">
        <div class="logo">
          <!-- Hexagon logo mark -->
          <svg class="logo-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#F7F3EC" />
            <polygon points="20,7 31,13.5 31,26.5 20,33 9,26.5 9,13.5" fill="none" stroke="#2D5016" stroke-width="1.5" />
            <!-- Mountain mark -->
            <polygon points="20,16 27,28 13,28" fill="#2D5016" />
          </svg>
          <span class="logo-text">Trailmark</span>
        </div>
      </div>
    </header>

    <main id="main-content">

      <!-- =====================
           HERO SECTION
      ===================== -->
      <section id="hero">

        <!-- ===== PARALLAX LAYERS ===== -->
        <!-- Stars: far background — barely shifts with scroll -->
        <div class="hero-stars" data-speed="0.05" aria-hidden="true"></div>

        <!-- Layer 1: Far — sun glow (slowest) -->
        <div class="hero-layer" data-speed="0.15" aria-hidden="true">
          <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <circle cx="600" cy="160" r="300" fill="rgba(245,195,60,0.05)" />
            <circle cx="600" cy="160" r="190" fill="rgba(242,182,52,0.10)" />
            <circle cx="600" cy="160" r="110" fill="rgba(248,200,65,0.16)" />
            <circle cx="600" cy="160" r="55"  fill="rgba(252,215,78,0.22)" />
          </svg>
        </div>

        <!-- Layer 2: Mid — mountain ranges (3 depths for atmospheric perspective) -->
        <div class="hero-layer" data-speed="0.30" aria-hidden="true">
          <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <!-- Furthest range: atmospheric haze tint -->
            <path d="M0,480 L0,295 L160,252 L340,262 L520,238 L700,254 L880,240 L1060,257 L1200,248 L1200,480 Z"
                  fill="rgba(115,150,135,0.20)" />
            <!-- Mid-far range -->
            <path d="M0,480 L0,320 L80,210 L180,280 L300,170 L440,250 L560,140 L680,230 L800,160 L920,230 L1040,175 L1140,215 L1200,200 L1200,480 Z"
                  fill="rgba(80,120,42,0.38)" />
            <!-- Mid-near range -->
            <path d="M0,480 L0,380 L110,295 L240,355 L380,265 L510,325 L640,240 L770,310 L900,255 L1020,305 L1120,270 L1200,290 L1200,480 Z"
                  fill="rgba(52,90,24,0.52)" />
          </svg>
        </div>

        <!-- Fog/mist layer — sits between mountains and forest -->
        <div class="hero-fog" data-speed="0.38" aria-hidden="true"></div>

        <!-- Layer 3: Near — forest silhouette (fastest) -->
        <div class="hero-layer" data-speed="0.50" aria-hidden="true">
          <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <path d="M0,480 L0,430 L35,350 L65,415 L100,325 L130,400 L165,310 L200,385 L240,295 L275,370 L315,280 L350,355 L390,265 L425,340 L465,255 L500,335 L540,260 L575,340 L615,260 L650,342 L690,268 L725,348 L765,270 L800,352 L840,275 L875,358 L910,278 L948,358 L985,284 L1020,364 L1060,284 L1095,365 L1132,288 L1168,362 L1200,320 L1200,480 Z"
                  fill="rgba(18,50,6,0.85)" />
          </svg>
        </div>

        <!-- Film grain texture overlay -->
        <div class="hero-grain" aria-hidden="true"></div>

        <div class="hero-inner">
          <p class="hero-eyebrow">America&rsquo;s Wild Places</p>
          <h1 class="hero-title">Explore America&rsquo;s<br />National Parks</h1>
          <p class="hero-subtitle">
            Every park tells a story. Discover the wild places that make America remarkable &mdash; one badge at a time.
          </p>
        </div>
      </section>

      <!-- =====================
           PARK GRID SECTION
      ===================== -->
      <section id="park-grid">
        <div class="section-inner">
          <h2 class="section-title">Featured Parks</h2>
          <p class="section-subtitle">A few places to start your journey.</p>

          <div class="search-bar">
            <label for="park-search" class="search-label">Search parks</label>
            <input
              type="search"
              id="park-search"
              class="search-input"
              placeholder="Name, state, or region…"
              autocomplete="off"
            >
          </div>

          <div class="cards-grid">
            <!-- Cards rendered dynamically by js/script.js -->
          </div><!-- /.cards-grid -->
        </div><!-- /.section-inner -->
      </section>

    </main>

    <!-- =====================
         FOOTER
    ===================== -->
    <footer id="site-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <svg class="footer-logo-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#F7F3EC" opacity="0.5" />
            <polygon points="20,7 31,13.5 31,26.5 20,33 9,26.5 9,13.5" fill="none" stroke="#F7F3EC" stroke-width="1.5" opacity="0.45" />
            <polygon points="20,16 27,28 13,28" fill="#F7F3EC" opacity="0.45" />
          </svg>
          <span class="footer-logo-text">Trailmark</span>
        </div>
        <p class="footer-copy">&copy; 2026 &mdash; Celebrating America&rsquo;s National Parks</p>
      </div>
    </footer>

    <!-- Park data -->
    <script src="js/parks-data.js"></script>
    <!-- Main script -->
    <script src="js/script.js"></script>
  </body>
</html>

# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Refreshes Today in the Parks data once a day, even with no code changes.
  schedule:
    - cron: "15 10 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh Today in the Parks data
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: node scripts/fetch-park-status.js
        continue-on-error: true
        # Never fails the deploy: on any error (including a missing
        # NPS_API_KEY secret) the script leaves data/park-status.json
        # untouched, so the site ships with the last committed snapshot
        # and today.html falls back to its "as of" notice for that data.
      - name: Omit original park art
        run: rm -rf assets/Parks
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the site, including assets/park-art, without the original PNGs.
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
